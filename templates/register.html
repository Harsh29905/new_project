{% extends "base.html" %}

{% block title %}Register - Online Banking{% endblock %}

{% block content %}
<style>
.btn-no-border {
    border: none;
    background: transparent;
}
.btn-no-border:hover, .btn-no-border:focus {
    background: rgba(0,0,0,0.05);
}
.input-group:not(:focus-within) .btn-no-border {
    color: #6c757d;
}
</style>

<div class="auth-container">
    <h2 class="text-center mb-4">Register</h2>
    
    <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>
    <div id="successAlert" class="alert alert-success d-none" role="alert"></div>
    
    <form id="registerForm" onsubmit="handleRegister(event)">
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" required>
            <div id="usernameError" class="invalid-feedback"></div>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" required>
            <div id="emailError" class="invalid-feedback"></div>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <div class="input-group">
                <input type="password" class="form-control" id="password" required onkeyup="checkPasswordStrength()">
                <button class="btn btn-no-border" type="button" id="togglePassword">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
            <div class="mt-2">
                <div class="progress" style="height: 5px;">
                    <div id="passwordStrength" class="progress-bar" role="progressbar" style="width: 0%"></div>
                </div>
                <small id="passwordStrengthText" class="form-text text-muted">Password strength</small>
            </div>
        </div>
        <div class="mb-3">
            <label for="confirm_password" class="form-label">Confirm Password</label>
            <div class="input-group">
                <input type="password" class="form-control" id="confirm_password" required>
                <button class="btn btn-no-border" type="button" id="toggleConfirmPassword">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
            <div id="passwordMatchError" class="invalid-feedback"></div>
        </div>
        <button type="submit" class="btn btn-primary w-100" id="registerButton">
            <span class="spinner-border spinner-border-sm d-none" id="registerSpinner" role="status"></span>
            <span id="registerText">Register</span>
        </button>
    </form>
    <p class="text-center mt-3">
        Already have an account? <a href="{{ url_for('login_page') }}">Login here</a>
    </p>
</div>

<script>
function togglePasswordVisibility(inputId, buttonId) {
    const input = document.getElementById(inputId);
    const button = document.getElementById(buttonId);
    const icon = button.querySelector('i');
    
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
    }
}

function checkPasswordStrength() {
    const password = document.getElementById('password').value;
    const strengthBar = document.getElementById('passwordStrength');
    const strengthText = document.getElementById('passwordStrengthText');
    
    let strength = 0;
    let feedback = '';
    
    if (password.length >= 8) strength += 25;
    if (password.match(/[a-z]/)) strength += 25;
    if (password.match(/[A-Z]/)) strength += 25;
    if (password.match(/[0-9]/)) strength += 25;
    
    strengthBar.style.width = strength + '%';
    
    if (strength < 25) {
        strengthBar.className = 'progress-bar bg-danger';
        feedback = 'Very Weak';
    } else if (strength < 50) {
        strengthBar.className = 'progress-bar bg-warning';
        feedback = 'Weak';
    } else if (strength < 75) {
        strengthBar.className = 'progress-bar bg-info';
        feedback = 'Medium';
    } else {
        strengthBar.className = 'progress-bar bg-success';
        feedback = 'Strong';
    }
    
    strengthText.textContent = feedback;
}

function handleRegister(event) {
    event.preventDefault();
    
    // Reset error states
    document.getElementById('errorAlert').classList.add('d-none');
    document.getElementById('usernameError').textContent = '';
    document.getElementById('emailError').textContent = '';
    document.getElementById('passwordMatchError').textContent = '';
    
    const username = document.getElementById('username').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm_password').value;
    
    // Validate password match
    if (password !== confirmPassword) {
        document.getElementById('passwordMatchError').textContent = 'Passwords do not match';
        return;
    }
    
    // Show loading state
    const button = document.getElementById('registerButton');
    const spinner = document.getElementById('registerSpinner');
    const buttonText = document.getElementById('registerText');
    button.disabled = true;
    spinner.classList.remove('d-none');
    buttonText.textContent = 'Registering...';
    
    fetch('/api/register', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            username: username,
            email: email,
            password: password
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.error) {
            // Handle specific field errors
            if (data.field === 'username') {
                document.getElementById('usernameError').textContent = data.message;
            } else if (data.field === 'email') {
                document.getElementById('emailError').textContent = data.message;
            } else {
                document.getElementById('errorAlert').textContent = data.message;
                document.getElementById('errorAlert').classList.remove('d-none');
            }
        } else {
            // Show success message with account ID
            const successAlert = document.getElementById('successAlert');
            successAlert.innerHTML = `
                <h4 class="alert-heading">Registration Successful!</h4>
                <p>Your account has been created successfully.</p>
                <hr>
                <p class="mb-0">Your Account ID: <strong>${data.account_id}</strong></p>
                <p class="mb-0">Please keep this ID safe. You'll need it for future reference.</p>
            `;
            successAlert.classList.remove('d-none');
            
            // Redirect to login page after 5 seconds
            setTimeout(() => {
                window.location.href = '/login';
            }, 5000);
        }
    })
    .catch(error => {
        console.error('Error:', error);
        document.getElementById('errorAlert').textContent = 'An error occurred during registration. Please try again.';
        document.getElementById('errorAlert').classList.remove('d-none');
    })
    .finally(() => {
        // Reset button state
        button.disabled = false;
        spinner.classList.add('d-none');
        buttonText.textContent = 'Register';
    });
}

// Initialize password visibility toggles
document.getElementById('togglePassword').addEventListener('click', () => {
    togglePasswordVisibility('password', 'togglePassword');
});

document.getElementById('toggleConfirmPassword').addEventListener('click', () => {
    togglePasswordVisibility('confirm_password', 'toggleConfirmPassword');
});
</script>
{% endblock %}
